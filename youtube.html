<!DOCTYPE html>
<html>
    <head>
        <title>Youtube</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <style>
            p {
                font-family: 'Roboto', 'Arial';
                margin-top: 0px;
                margin-bottom: 0px
            }
            .thumbnail {
                width: 300px;
                display: block;
            }
            .search-bar {
                display: block;
            }
           .video-title{
                margin-top: 0;
           }
            .video-preview {
                display: inline-block;
                width: 300px;
                vertical-align: top;
                margin-right: 15px;
            }
            .video-creator-avatar {
                display: inline-block;
                width: 50px;
                vertical-align: top;
            }
            .video-info {
                display: inline-block;
                width: 200px;
            }
            .creator-pfp {
                width: 40px;
                border-radius: 50px;
            }
            .thumbnail-row {
                margin-bottom: 12px;
            }
            .video-title {
                font-size: 16px;
                font-weight: 500;
                line-height: 20px;
                margin-bottom: 12px;
            }
            .video-creator,
            .video-stats {
                font-size: 12px;
                color: #606060;
                margin-bottom: 4px;
            }
            .video-creator {
                margin-bottom: 4px;
            }
            
        </style>
    </head>
    <body>
        <input class="search-bar" type="text" placeholder="Search">
        <div class="video-preview">

            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-1.webp">
            </div>

            <div class="video-creator-avatar">
                <img class="creator-pfp" src="creators/channel-1.jpeg">
            </div>

            <div class="video-info">

            <p class="video-title">
                Talking Tech and AI with Google CEO Sundar Pichai!
            </p>
            <p class="video-creator">
                Marques Brownlee
            </p>
            <p class="video-stats">
                3.4M views &#183; 6 months ago
            </p>

            </div>
        </div>   

        <div class="video-preview">

            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-2.webp">
            </div>

            <div class="video-creator-avatar">
                <img class="creator-pfp" src="creators/channel-2.jpeg">
            </div>

            <div class="video-info">

                <p class="video-title">
                    Try Not To Laugh Challenge #9
                </p>
                <p class="video-creator">
                    Markiplier
                </p>
                <p class="video-stats">
                    19M views &#183; 4 years ago
                </p>

            </div>
        </div>

        <div class="video-preview">

            <div class="thumbnail-row">
                <img class="thumbnail" src="thumbnails/thumbnail-3.webp">
            </div>

            <div class="video-creator-avatar">
                <img class="creator-pfp" src="creators/channel-3.jpeg">
            </div>

            <div class="video-info">

                <p class="video-title">
                    Crazy Tik Toks Taken Moments Before DISASTER
                </p>
                <p class="video-creator">
                    SSSniperWolf
                </p>
                <p class="video-stats">
                    12M views &#183; 1 year ago
                </p>

            </div>
        </div>
    </body>
</html>
