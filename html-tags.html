    <p>The following are some common HTML tags:</p>
    <h3>HTML Tags</h3>
    <ol>
        <li><code>&lt;h1&gt;</code> to <code>&lt;h6&gt;</code> are heading tags.</li>
        <li><code>&lt;b&gt;</code> is a <b>bold</b> tag.</li>
        <li><code>&lt;p&gt;</code> is a paragraph tag.</li>
        <li><code>&lt;ul&gt;</code> is an unordered list tag.</li>
        <li><code>&lt;ol&gt;</code> is an ordered list tag.</li>
    </ol>
